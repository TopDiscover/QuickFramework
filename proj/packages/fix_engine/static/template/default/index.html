<div class="container">
    <h2>引擎修复工具</h2>
    <ui-hint style="font-size: medium;">
        引擎版本: <span
            style="color : rgb(19, 255, 19); white-space : nowrap">{{creatorVerion}}</span>
        <br>
        引擎路径: <span
            style="color : rgb(19, 255, 19); white-space : nowrap">{{creatorPath}}</span>
        <br>
        支持版本: <span
            style="color : rgb(19, 255, 19); white-space : nowrap">{{supportVersions}}</span>
        <br>
    </ui-hint>

    <h2>操作</h2>
    <ui-box-container class="layout vertical">
        <div style="display: flex; align-items: center; margin-bottom: 5px;">
            <ui-hint
                style="flex-grow: 1; margin-right: 10px;">备份引擎到项目中，方便引擎的还原</ui-hint>
            <ui-button id="engineBackup"
                @confirm="onEngineBackup">引擎备份
            </ui-button>
            
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 5px;">
            <ui-hint
                style="flex-grow: 1; margin-right: 10px;">被修改过的引擎文件进行还原</ui-hint>
            <ui-button id="engineRestore"
                @confirm="onEngineRestore">引擎还原</ui-button>
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 5px;">
            <ui-hint
                style="flex-grow: 1; margin-right: 10px;">同步引擎修改到项目</ui-hint>
            <ui-button id="syncEngineToCustom"
                @confirm="onSyncEngineToCustom">同步引擎修改到项目</ui-button>
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 5px;">
            <ui-hint
                style="flex-grow: 1; margin-right: 10px;">同步项目修改到引擎</ui-hint>
            <ui-button id="syncCustomToEngine"
                @confirm="onSyncCustomToEngine">同步项目修改到引擎</ui-button>
        </div>
    </ui-box-container>

    <h2>包含引擎文件和目录</h2>
    <ui-box-container class="layout vertical">
        <ui-hint>
            配置 <span
                style="color : rgb(19, 255, 19); white-space : nowrap">glob模式</span>
            以包含文件和文件夹,来匹配引擎中的文件的变化
        </ui-hint>
        <ui-box-container class="layout vertical">
            <div id = "uiInclude" v-for="(index,item) in config.include"
                style="display: flex; align-items: center; margin-bottom: 5px;">
                <ui-input v-bind:value="config.include[index]" redonly
                    style="flex-grow: 1; margin-right: 10px;"></ui-input>
                <ui-button @click="removeIncludeItem(index)">删除</ui-button>
            </div>
            <ui-hint v-if="config.include.length === 0">暂未配置包含文件</ui-hint>
            <div
                style="display: flex; align-items: center; margin-bottom: 5px;">
                <ui-input id="addIncludeItem" redonly
                    style="flex-grow: 1; margin-right: 10px;"></ui-input>
                <ui-button id = "addIncludeBtn" @click="addIncludeItem()">添加</ui-button>
                <ui-button id = "resetBtn" @click="reset()">恢复默认</ui-button>
            </div>
        </ui-box-container>
    </ui-box-container>
</div>
